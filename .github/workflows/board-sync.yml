# Message board moderation -> live site
#
# Notes arrive as GitHub issues labelled "board-post". Nothing is published
# until you add the "approved" label. This workflow watches for that (and for
# replies, edits, and takedowns), regenerates assets/data/board.json, commits
# it, and kicks off the normal Pages deploy.
#
# Notification is a separate workflow: board-notify.yml @-mentions you when a
# note arrives, which is the one thing GitHub Mobile will actually push. No
# email is involved at any point.
#
# Moderation cheat sheet:
#   add label "approved"    -> the note goes up
#   remove it, or close     -> the note comes down
#   add label "pinned"      -> the note sticks to the top
#   add label "style:flyer" -> force a paper style
#   comment on the issue    -> your reply appears in red marker on the note
#   comment starting with // -> internal, never published

name: Sync Message Board

on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]

  issue_comment:
    types: [created, edited, deleted]

  # Manual re-sync from the Actions tab
  workflow_dispatch:

  # Safety net in case an event is ever missed
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write   # commit the regenerated board.json
  issues: read      # read notes and replies
  actions: write    # trigger the Pages deploy

# Never let two syncs write board.json at the same time
concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # No dependencies - the script uses Node's built-in fetch
      - name: Regenerate board data
        run: node scripts/sync-board.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # The concurrency group above serializes syncs, but two issue events a
      # second apart can both start before the gate registers, and then the
      # slower one's push is rejected. board.json is a pure function of
      # board-seed.json plus the current issue state, so the cure is just to
      # rebuild on top of whatever landed first and try again. If the other run
      # already wrote the same thing, the rebuild comes out identical, the diff
      # is clean, and this run stands down instead of failing.
      - name: Commit if the board changed
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "durtnurs-board[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            if git diff --quiet -- assets/data/board.json; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Board unchanged, nothing to deploy."
              exit 0
            fi

            git add assets/data/board.json
            git commit -m "Update message board from approved notes"

            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rejected on attempt $attempt - another sync got there first."
            git fetch origin main
            git reset --hard origin/main
            node scripts/sync-board.js
          done

          echo "Could not push after 3 attempts. The 06:17 cron will catch it up."
          exit 1

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # Pages build has to be dispatched explicitly against the new commit.
      - name: Deploy the updated board
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run build-deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
